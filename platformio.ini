[env:esp32-c3-devkitm-1]
; 7.x = Arduino-ESP32 2.0.17. Plattform 8.x (Arduino 3.x) erzeugt rund 2 MB und passt nicht in die 1,5-MB-OTA-Slots.
platform = espressif32@^7.1.3
board = esp32-c3-devkitm-1
framework = arduino
extra_scripts = 
  pre:scripts/build_ui.py
  pre:scripts/inject_version.py
lib_deps = 
  ESP32Async/ESPAsyncWebServer@^3.12.1
  ESP32Async/AsyncTCP@^3.5.0
  bblanchon/ArduinoJson@^7.4.3
  knolleary/PubSubClient@^2.8
  pololu/VL53L1X@^1.3.1
build_flags = 
  -DCORE_DEBUG_LEVEL=0
  -DNDEBUG
  -Isrc/app
  -Isrc/core
  -Isrc/config
  -Isrc/sensors
  -Isrc/networking
  -Isrc/mqtt
  -Isrc/notifications
  -Isrc/history
  -Isrc/web
; ESPAsyncWebServer deklariert Abhaengigkeiten fuer ESP8266/RP2040, die auf dem ESP32 nicht bauen.
lib_ignore =
  ESPAsyncTCP
  RPAsyncTCP
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv